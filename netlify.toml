# =============================================================================
# NETLIFY DEPLOYMENT CONTRACT
# -----------------------------------------------------------------------------
# - build/publish match package.json + Astro static output;
# - Node is pinned for reproducible CI builds;
# - baseline security/privacy headers apply to every response;
# - hashed Astro assets are immutable; public brand assets use a shorter cache
#   because their filenames are stable across brand updates.
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
